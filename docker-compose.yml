services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: circus
      POSTGRES_DB: circus
      POSTGRES_HOST_AUTH_METHOD: trust   # dev only
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circus"]
      interval: 2s
      retries: 30

  circus:
    image: ghcr.io/teajhay/circus-docker:main
    depends_on:
      postgres: { condition: service_healthy }
    env_file:
      - stack.env
    ports: ["3000:3000", "2222:22"]
    volumes: [keys:/keys, nix:/nix, config:/etc/config ]

volumes: { pgdata: {}, keys: {}, nix: {}, config: {} }
